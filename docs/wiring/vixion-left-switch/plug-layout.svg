<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="820" height="760" fill="#ffffff"/>
  <style>
    .t{fill:#111}
    .g{fill:#777}
    .h{font-weight:bold;font-size:15px}
    .b{font-weight:bold}
    .s{font-size:11px}
    .body{fill:#f7f3e3;stroke:#333;stroke-width:1.5}
    .latch{fill:#d8d2bb;stroke:#333;stroke-width:1.5}
    .cav{fill:#fff;stroke:#333;stroke-width:1.2}
    .warn{fill:#b00020;font-size:12px}
  </style>

  <text x="20" y="28" class="t h">4-pin and 3-pin plugs: cavity positions (latch on top in every view)</text>

  <!-- ROW 1: bike side -->
  <text x="20" y="62" class="t b">Bike side (harness)</text>

  <!-- bike mating face -->
  <g transform="translate(40,75)">
    <text x="0" y="0" class="t s">Mating face (the side that plugs in)</text>
    <rect x="70" y="10" width="60" height="16" class="latch"/>
    <rect x="20" y="26" width="160" height="150" class="body"/>
    <rect x="35" y="40" width="60" height="55" class="cav"/><circle cx="65" cy="62" r="11" fill="#e58fb0"/><text x="65" y="88" text-anchor="middle" class="t b s">P</text>
    <rect x="105" y="40" width="60" height="55" class="cav"/><circle cx="135" cy="62" r="11" fill="#9a5a34"/><text x="135" y="88" text-anchor="middle" class="t b s">Br</text>
    <rect x="35" y="108" width="60" height="55" class="cav"/><circle cx="65" cy="130" r="11" fill="#c8303a"/><text x="65" y="156" text-anchor="middle" class="t b s">R/B</text>
    <rect x="105" y="108" width="60" height="55" class="cav"/><circle cx="135" cy="130" r="11" fill="#9a5a34"/><text x="135" y="156" text-anchor="middle" class="t b s">Br</text>
  </g>

  <!-- bike wire end -->
  <g transform="translate(300,75)">
    <text x="0" y="0" class="t s">Wire end (where the wires go in)</text>
    <rect x="70" y="10" width="60" height="16" class="latch"/>
    <rect x="20" y="26" width="160" height="150" class="body"/>
    <rect x="35" y="40" width="60" height="55" class="cav"/><circle cx="65" cy="62" r="11" fill="#9a5a34"/><text x="65" y="88" text-anchor="middle" class="t b s">Br</text>
    <rect x="105" y="40" width="60" height="55" class="cav"/><circle cx="135" cy="62" r="11" fill="#e58fb0"/><text x="135" y="88" text-anchor="middle" class="t b s">P</text>
    <rect x="35" y="108" width="60" height="55" class="cav"/><circle cx="65" cy="130" r="11" fill="#9a5a34"/><text x="65" y="156" text-anchor="middle" class="t b s">Br</text>
    <rect x="105" y="108" width="60" height="55" class="cav"/><circle cx="135" cy="130" r="11" fill="#c8303a"/><text x="135" y="156" text-anchor="middle" class="t b s">R/B</text>
  </g>

  <text x="560" y="100" class="t s">Measured on the bike, mating face,</text>
  <text x="560" y="116" class="t s">latch on top:</text>
  <text x="560" y="138" class="t s">TL pink (P)</text>
  <text x="560" y="154" class="t s">TR brown (Br)</text>
  <text x="560" y="170" class="t s">BL red/black (R/B)</text>
  <text x="560" y="186" class="t s">BR brown (Br)</text>
  <text x="560" y="210" class="g s">The two Br are the same supply</text>
  <text x="560" y="224" class="g s">(they beep to each other).</text>

  <!-- ROW 2: switch side -->
  <text x="20" y="300" class="t b">Switch side (the shop's plug, wire colours don't match)</text>

  <!-- switch mating face -->
  <g transform="translate(40,313)">
    <text x="0" y="0" class="t s">Mating face</text>
    <rect x="70" y="10" width="60" height="16" class="latch"/>
    <rect x="20" y="26" width="160" height="150" class="body"/>
    <rect x="35" y="40" width="60" height="55" class="cav"/><text x="65" y="72" text-anchor="middle" class="t b">Br</text>
    <rect x="105" y="40" width="60" height="55" class="cav"/><text x="135" y="72" text-anchor="middle" class="t b">P</text>
    <rect x="35" y="108" width="60" height="55" class="cav"/><text x="65" y="140" text-anchor="middle" class="t b">Br</text>
    <rect x="105" y="108" width="60" height="55" class="cav"/><text x="135" y="140" text-anchor="middle" class="t b">R/B</text>
  </g>

  <!-- switch wire end -->
  <g transform="translate(300,313)">
    <text x="0" y="0" class="t s">Wire end (where you splice)</text>
    <rect x="70" y="10" width="60" height="16" class="latch"/>
    <rect x="20" y="26" width="160" height="150" class="body"/>
    <rect x="35" y="40" width="60" height="55" class="cav"/><text x="65" y="66" text-anchor="middle" class="t b">P</text><text x="65" y="84" text-anchor="middle" class="t s">old pink</text>
    <rect x="105" y="40" width="60" height="55" class="cav"/><text x="135" y="66" text-anchor="middle" class="t b">Br</text><text x="135" y="84" text-anchor="middle" class="t s">old lt brown</text>
    <rect x="35" y="108" width="60" height="55" class="cav"/><text x="65" y="134" text-anchor="middle" class="t b">R/B</text><text x="65" y="152" text-anchor="middle" class="t s">clutch 1</text>
    <rect x="105" y="108" width="60" height="55" class="cav"/><text x="135" y="134" text-anchor="middle" class="t b">Br</text><text x="135" y="152" text-anchor="middle" class="t s">or empty</text>
  </g>

  <text x="560" y="340" class="t s">The switch plug's mating face is the</text>
  <text x="560" y="356" class="t s">mirror of the bike's mating face.</text>
  <text x="560" y="380" class="t s">So the switch plug seen from its wire</text>
  <text x="560" y="396" class="t s">end matches the bike plug seen from</text>
  <text x="560" y="412" class="t s">its mating face.</text>
  <text x="560" y="436" class="t s">Old light brown can go in either Br.</text>

  

  <!-- 3-pin -->
  <text x="20" y="540" class="t b">3-pin plug</text>
  <g transform="translate(40,553)">
    <text x="0" y="0" class="t s">Bike side, mating face</text>
    <rect x="80" y="10" width="40" height="14" class="latch"/>
    <rect x="10" y="24" width="180" height="80" class="body"/>
    <rect x="20" y="36" width="50" height="55" class="cav"/><circle cx="45" cy="56" r="10" fill="#1f7a4d"/><text x="45" y="83" text-anchor="middle" class="t b s">Dg</text>
    <rect x="75" y="36" width="50" height="55" class="cav"/><circle cx="100" cy="56" r="10" fill="#222"/><text x="100" y="83" text-anchor="middle" class="t b s">B/W</text>
    <rect x="130" y="36" width="50" height="55" class="cav"/><circle cx="155" cy="56" r="10" fill="#5a3a22"/><text x="155" y="83" text-anchor="middle" class="t b s">Ch</text>
  </g>
  <g transform="translate(300,553)">
    <text x="0" y="0" class="t s">Shop plug, mating face (mirror)</text>
    <rect x="80" y="10" width="40" height="14" class="latch"/>
    <rect x="10" y="24" width="180" height="80" class="body"/>
    <rect x="20" y="36" width="50" height="55" class="cav"/><text x="45" y="60" text-anchor="middle" class="t b">Ch</text><text x="45" y="80" text-anchor="middle" class="t s">dk brown</text>
    <rect x="75" y="36" width="50" height="55" class="cav"/><text x="100" y="60" text-anchor="middle" class="t b">B/W</text><text x="100" y="80" text-anchor="middle" class="t s">clutch 2</text>
    <rect x="130" y="36" width="50" height="55" class="cav"/><text x="155" y="60" text-anchor="middle" class="t b">Dg</text><text x="155" y="80" text-anchor="middle" class="t s">dk green</text>
  </g>
  <text x="560" y="580" class="t s">Measured on the bike, mating face,</text>
  <text x="560" y="596" class="t s">latch up: green, black, brown</text>
  <text x="560" y="612" class="t s">(left to right).</text>
  <text x="560" y="636" class="t s">Shop plug: identify each cavity's</text>
  <text x="560" y="652" class="t s">pigtail wire by continuity, then</text>
  <text x="560" y="668" class="t s">splice by the labels shown.</text>

  <text x="20" y="745" class="warn">R/B: clutch switch only. The horn's black wire never goes on R/B or B/W.</text>
</svg>
